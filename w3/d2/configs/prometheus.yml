global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'mock-services'
    static_configs:
      - targets:
          - 'frontend:8080'
          - 'api-gateway:8080'
          - 'payment-svc:8080'
          - 'inventory-svc:8080'
          - 'notification-svc:8080'
          - 'checkout-svc:8080'
          - 'auth-svc:8080'
          - 'log-collector:8080'
          - 'dns-resolver:8080'
          - 'cache-svc:8080'
          - 'payment-db:8080'
          - 'inventory-db:8080'
          - 'kafka-mock:8080'
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'aiops-pipeline'
    static_configs:
      - targets: ['aiops-pipeline:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
